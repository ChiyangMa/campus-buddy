<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Campus Buddy</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- 网站顶部 -->

    <header>

        <h1>Campus Buddy</h1>

        <nav>
            <a href="#">首页</a>
            <a href="#">找搭子</a>
            <a href="#">发布</a>
            <a href="#">我的</a>
        </nav>

    </header>


    <!-- 首页主要内容 -->

    <main>

        <section>

            <h2>找到你的校园搭子</h2>

            <p>
                一起吃饭、运动、学习、旅行，
                找到志同道合的校园伙伴。
            </p>

            <button id="findBuddyButton">
                寻找搭子
            </button>

            <button id="createBuddyButton">
                发布搭子
            </button>

        </section>


        <!-- 搭子分类 -->

        <section>

            <h2>你想找什么搭子？</h2>

            <div>

                <button>🍜 饭搭子</button>

                <button>🏸 运动搭子</button>

                <button>📚 学习搭子</button>

                <button>🎮 游戏搭子</button>

                <button>🎬 娱乐搭子</button>

                <button>✈️ 旅行搭子</button>

            </div>

        </section>


        <!-- 搭子列表 -->

        <section>

            <h2>最新搭子</h2>

            <article>

                <h3>🏸 周六羽毛球搭子</h3>

                <p>地点：NTU</p>

                <p>时间：周六 16:00</p>

                <p>人数：2 / 4</p>

                <button>我想加入</button>

            </article>


            <article>

                <h3>🍜 周五晚饭搭子</h3>

                <p>地点：学校附近</p>

                <p>时间：周五 19:00</p>

                <p>人数：3 / 5</p>

                <button>我想加入</button>

            </article>

        </section>

    </main>


    <!-- 网站底部 -->

    <footer>

        <p>© 2026 Campus Buddy</p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
